[package]
name = "victory-core"
description = "Shared plumbing: configuration, paths, the asset-policy guard, logging."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
toml.workspace = true
tracing-subscriber.workspace = true
tracy-client = { workspace = true, optional = true }
tracy-client-sys = { workspace = true, optional = true }
tracing-tracy = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[features]
# Lets `VICTORY_LOG` enable debug and trace output.
diagnostics = []
# Starts the Tracy profiler's client and sends it the log lines.
tracy = ["dep:tracy-client", "dep:tracy-client-sys", "dep:tracing-tracy"]

[lints]
workspace = true
